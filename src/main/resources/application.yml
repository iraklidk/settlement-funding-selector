spring:
  application:
    name: settlement-funding-selector
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settlement}
    username: ${DB_USERNAME:settlement}
    password: ${DB_PASSWORD:settlement}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only checks that entities match it at startup.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}

settlement:
  funding:
    # Max (instructions x scaled capacity) cells for the DP solver; larger instances use branch-and-bound.
    dp-max-cells: 50000000

info:
  app:
    name: settlement-funding-selector
    description: Settlement funding selection service
    version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

