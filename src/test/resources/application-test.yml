spring:
  datasource:
    # In-memory H2 in PostgreSQL compatibility mode: the same Flyway migration runs unchanged.
    url: jdbc:h2:mem:settlement;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
logging:
  level:
    ge.kursi.settlement: DEBUG
